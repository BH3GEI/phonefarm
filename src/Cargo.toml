[package]
name = "phonefarm"
version = "0.2.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
quick-xml = "0.36"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
flate2 = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
strip = true
lto = true

[[bin]]
name = "phonefarm"
path = "main.rs"
