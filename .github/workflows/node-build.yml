# 节点（手机农场 Mac mini）不再自己编译：push 到 main 时在云端编好 phonefarm（macOS arm64）
# 和灰档层 libVkLayer_refknobs.so（NDK arm64-v8a），覆盖上传到固定 release `node-build`。
# 节点的 harness-ops/node/update_node.sh --git 读 build.json，sha 对得上就直接下载。
# 资产：phonefarm、libVkLayer_refknobs.so、VkLayer_refknobs.json、build.json（最后上传）。
name: node-build

on:
  push:
    branches: [main]
  workflow_dispatch:
  # PR 里改了这个 workflow 时只跑编译验证，不发 release
  pull_request:
    paths: ['.github/workflows/node-build.yml']

# 同一时刻只跑一个，新的 push 排队；不取消正在上传的那次，免得 release 停在半截
concurrency:
  group: node-build
  cancel-in-progress: false

permissions:
  contents: read

env:
  NDK_VERSION: 28.2.13676358

jobs:
  phonefarm:
    runs-on: macos-14   # arm64
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src
      - name: cargo build --release
        run: cd src && cargo build --release
      - name: 检查产物
        run: |
          file src/target/release/phonefarm
          ls -la src/target/release/phonefarm
          src/target/release/phonefarm --help >/dev/null 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: phonefarm
          path: src/target/release/phonefarm
          retention-days: 3

  gray-layer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: 找 runner 自带的 NDK
        id: ndk
        run: |
          pre="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/ndk/$NDK_VERSION"
          if [ -x "$pre/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++" ]; then
            echo "runner 自带 NDK $NDK_VERSION"; echo "path=$pre" >> "$GITHUB_OUTPUT"
          else
            echo "runner 没带 $NDK_VERSION，走缓存/下载"; echo "path=$RUNNER_TEMP/ndk/$NDK_VERSION" >> "$GITHUB_OUTPUT"; echo "need=1" >> "$GITHUB_OUTPUT"
          fi
      - name: NDK 缓存
        if: steps.ndk.outputs.need == '1'
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.ndk.outputs.path }}
          key: ndk-${{ runner.os }}-${{ env.NDK_VERSION }}
      - name: 下载 NDK
        if: steps.ndk.outputs.need == '1' && steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" >/dev/null
          mkdir -p "$(dirname "${{ steps.ndk.outputs.path }}")"
          mv "$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" "${{ steps.ndk.outputs.path }}"
      - name: build_layer.sh
        run: |
          grep Pkg.Revision "${{ steps.ndk.outputs.path }}/source.properties"
          REFBENCH_NDK="${{ steps.ndk.outputs.path }}" knobs/gray/build/build_layer.sh
      - uses: actions/upload-artifact@v4
        with:
          name: gray-layer
          path: |
            knobs/gray/build/out/libVkLayer_refknobs.so
            knobs/gray/build/out/VkLayer_refknobs.json
          retention-days: 3

  release:
    needs: [phonefarm, gray-layer]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - name: 写 build.json
        run: |
          mkdir out
          cp dl/phonefarm/phonefarm dl/gray-layer/libVkLayer_refknobs.so dl/gray-layer/VkLayer_refknobs.json out/
          python3 - <<'PY'
          import hashlib, json, os, datetime
          files = {}
          for f in sorted(os.listdir("out")):
              d = open(f"out/{f}", "rb").read()
              files[f] = {"sha256": hashlib.sha256(d).hexdigest(), "size": len(d)}
          info = {
              "sha": os.environ["GITHUB_SHA"],
              "built_at": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "run_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "ndk": os.environ["NDK_VERSION"],
              "files": files,
          }
          json.dump(info, open("build.json", "w"), indent=2)
          print(json.dumps(info, indent=2))
          PY
      - name: 上传到 release node-build
        run: |
          # 只有比 release 现有 sha 更新（是它的后代）才覆盖，防止排队的旧提交盖掉新产物
          if old=$(gh release download node-build -p build.json -O - 2>/dev/null | python3 -c 'import json,sys;print(json.load(sys.stdin)["sha"])'); then
            st=$(gh api "repos/$GH_REPO/compare/$old...$GITHUB_SHA" -q .status || echo unknown)
            echo "release 现有 $old，本次 $GITHUB_SHA：$st"
            if [ "$st" = behind ]; then echo "本次比 release 旧，不覆盖"; exit 0; fi
          fi
          gh release view node-build >/dev/null 2>&1 || \
            gh release create node-build --target "$GITHUB_SHA" --prerelease --title node-build \
              --notes "节点用的预编译产物（phonefarm macOS arm64 + 灰档层 .so），每次 push main 覆盖。以 build.json 的 sha 为准，tag 位置不代表产物版本。"
          # 先传二进制，build.json 最后传：节点看到新 sha 时二进制已经是新的（还会按 sha256 再核对）
          gh release upload node-build out/phonefarm out/libVkLayer_refknobs.so out/VkLayer_refknobs.json --clobber
          gh release upload node-build build.json --clobber
