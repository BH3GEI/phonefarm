# 节点（手机农场 Mac mini）不再自己编译：push 到 main 时在云端编好 phonefarm（macOS arm64）
# 和灰档层 libVkLayer_refknobs.so（NDK arm64-v8a），按完整 SHA 发布到 release `node-build`。
# stable 复用已通过的 main 构建；版本资产与镜像不自动删除、不覆盖同 SHA 的不同内容。
# SHA-build.json 最后发布；裸名/build.json 只为旧节点保留，不能代替精确版本。
name: node-build

on:
  push:
    branches: [main]
  workflow_dispatch:
  # PR 里改了这个 workflow 时只跑编译验证，不发 release
  pull_request:
    paths: ['.github/workflows/node-build.yml']

# 同一时刻只跑一个，新的 push 排队；不取消正在上传的那次，免得 release 停在半截
concurrency:
  group: node-build
  cancel-in-progress: false

permissions:
  contents: read

env:
  NDK_VERSION: 28.2.13676358

jobs:
  phonefarm:
    runs-on: macos-14   # arm64
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src
      - name: cargo build --release
        env:
          HGAMEY_BUILD_REVISION: ${{ github.sha }}
          HGAMEY_BUILD_DIRTY: 'false'
        run: cd src && cargo build --release
      - name: 检查产物
        run: |
          file src/target/release/phonefarm
          ls -la src/target/release/phonefarm
          src/target/release/phonefarm --help >/dev/null 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: phonefarm
          path: src/target/release/phonefarm
          retention-days: 3

  gray-layer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: 找 runner 自带的 NDK
        id: ndk
        run: |
          pre="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/ndk/$NDK_VERSION"
          if [ -x "$pre/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++" ]; then
            echo "runner 自带 NDK $NDK_VERSION"; echo "path=$pre" >> "$GITHUB_OUTPUT"
          else
            echo "runner 没带 $NDK_VERSION，走缓存/下载"; echo "path=$RUNNER_TEMP/ndk/$NDK_VERSION" >> "$GITHUB_OUTPUT"; echo "need=1" >> "$GITHUB_OUTPUT"
          fi
      - name: NDK 缓存
        if: steps.ndk.outputs.need == '1'
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.ndk.outputs.path }}
          key: ndk-${{ runner.os }}-${{ env.NDK_VERSION }}
      - name: 下载 NDK
        if: steps.ndk.outputs.need == '1' && steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" >/dev/null
          mkdir -p "$(dirname "${{ steps.ndk.outputs.path }}")"
          mv "$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" "${{ steps.ndk.outputs.path }}"
      - name: build_layer.sh
        run: |
          grep Pkg.Revision "${{ steps.ndk.outputs.path }}/source.properties"
          REFBENCH_NDK="${{ steps.ndk.outputs.path }}" knobs/gray/build/build_layer.sh
      - uses: actions/upload-artifact@v4
        with:
          name: gray-layer
          path: |
            knobs/gray/build/out/libVkLayer_refknobs.so
            knobs/gray/build/out/VkLayer_refknobs.json
          retention-days: 3

  release:
    needs: [phonefarm, gray-layer]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - name: 写 build.json
        run: |
          mkdir out
          cp dl/phonefarm/phonefarm dl/gray-layer/libVkLayer_refknobs.so dl/gray-layer/VkLayer_refknobs.json out/
          python3 - <<'PY'
          import hashlib, json, os, datetime
          files = {}
          for f in sorted(os.listdir("out")):
              digest = hashlib.sha256()
              with open(f"out/{f}", "rb") as stream:
                  for chunk in iter(lambda: stream.read(1 << 20), b""):
                      digest.update(chunk)
              files[f] = {"sha256": digest.hexdigest(), "size": os.path.getsize(f"out/{f}"),
                          "asset": f"{os.environ['GITHUB_SHA']}-{f}"}
          info = {
              "sha": os.environ["GITHUB_SHA"],
              "built_at": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "run_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "ndk": os.environ["NDK_VERSION"],
              "files": files,
          }
          json.dump(info, open("build.json", "w"), indent=2)
          print(json.dumps(info, indent=2))
          PY
          # 仅供本次发布使用：既有 manifest 与实际文件均核验，时间/run_url 不参与内容身份。
          cat > verify_build.py <<'PY'
          import hashlib, json, pathlib, sys

          EXPECTED = json.loads(pathlib.Path("build.json").read_text())

          def manifest(path, *, versioned=False):
              raw = pathlib.Path(path).read_bytes()
              if len(raw) > 65536:
                  raise ValueError("existing manifest too large")
              value = json.loads(raw)
              if (not isinstance(value, dict) or value.get("sha") != EXPECTED["sha"]
                      or not isinstance(value.get("files"), dict)
                      or set(value["files"]) != set(EXPECTED["files"])):
                  raise ValueError("immutable manifest identity mismatch")
              for name, wanted in EXPECTED["files"].items():
                  old = value["files"][name]
                  if (not isinstance(old, dict) or type(old.get("size")) is not int
                          or any(old.get(k) != wanted[k] for k in ("size", "sha256"))
                          or (versioned and old.get("asset") != wanted["asset"])):
                      raise ValueError("immutable manifest content mismatch: " + name)
              return value

          def file(path, wanted):
              digest, size = hashlib.sha256(), 0
              with pathlib.Path(path).open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1 << 20), b""):
                      size += len(chunk)
                      digest.update(chunk)
              if size != wanted["size"] or digest.hexdigest() != wanted["sha256"]:
                  raise ValueError("immutable asset content mismatch: " + pathlib.Path(path).name)

          if __name__ == "__main__":
              directory = pathlib.Path(sys.argv[1])
              manifest(directory / "build.json")  # 旧 mirror 的 12 位 asset 名仍兼容。
              for name, wanted in EXPECTED["files"].items():
                  file(directory / name, wanted)
          PY
      - name: 推 git ref 镜像 refs/node-build/sha/<提交>
        # 节点（国内网络）访问 release 资产要跳转到 release-assets.githubusercontent.com（Fastly），时好时坏；
        # 节点拉源码走的 ssh github.com 一直稳。所以产物也做成一个孤立提交推到隐藏 ref（不在 refs/heads 下，
        # 普通 clone/fetch 不会下载它），节点用 git 按提交号取。同 SHA 仅验证复用，不 force 更新。
        run: |
          mkdir mirror
          git -C mirror init -q
          remote="https://x-access-token:${GH_TOKEN}@github.com/$GH_REPO.git"
          ref="refs/node-build/sha/$GITHUB_SHA"
          if git ls-remote --exit-code "$remote" "$ref" > mirror-ref.txt; then
            git -C mirror fetch -q --depth 1 "$remote" "$ref"
            mkdir existing-mirror
            for f in build.json phonefarm libVkLayer_refknobs.so VkLayer_refknobs.json; do
              git -C mirror cat-file "blob" "FETCH_HEAD:$f" > "existing-mirror/$f"
            done
            python3 verify_build.py existing-mirror
            echo "复用已核验 mirror $GITHUB_SHA"
          else
            rc=$?
            [ "$rc" = 2 ] || exit "$rc"
            cp out/* build.json mirror/
            git -C mirror config user.name node-build
            git -C mirror config user.email node-build@users.noreply.github.com
            git -C mirror add -A
            git -C mirror commit -qm "node-build $GITHUB_SHA"
            git -C mirror push -q "$remote" "HEAD:$ref"
          fi
          # 不按最近 N 个删除：stable promotion 与清理不共享事务。保留政策另行审查。
      - name: 上传到 release node-build
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, shutil, subprocess
          from verify_build import EXPECTED, file, manifest

          def gh(*args):
              return subprocess.check_output(["gh", *args], stderr=subprocess.PIPE).decode()

          try:
              release = json.loads(gh("api", f"repos/{os.environ['GH_REPO']}/releases/tags/node-build"))
          except subprocess.CalledProcessError as error:
              if b"(HTTP 404)" not in error.stderr:
                  raise
              gh("release", "create", "node-build", "--target", EXPECTED["sha"], "--prerelease",
                 "--title", "node-build", "--notes",
                 "Exact full-SHA assets and manifests; build.json is a compatibility pointer, not the tag's version.")
              release = json.loads(gh("api", f"repos/{os.environ['GH_REPO']}/releases/tags/node-build"))
          pages = json.loads(gh("api", "--paginate", "--slurp",
                                f"repos/{os.environ['GH_REPO']}/releases/{release['id']}/assets?per_page=100"))
          assets = {item["name"] for page in pages for item in page}
          versioned = pathlib.Path("vout")
          existing = pathlib.Path("existing-release")
          versioned.mkdir()
          existing.mkdir()

          def download(name):
              path = existing / name
              gh("release", "download", "node-build", "-p", name, "-O", str(path))
              return path

          # 先核全部既有内容，任何冲突都在本次上传前失败；允许中断后补齐缺失资产。
          manifest_name = EXPECTED["sha"] + "-build.json"
          candidate = pathlib.Path("build.json")
          if manifest_name in assets:
              candidate = download(manifest_name)
              manifest(candidate, versioned=True)
          missing = []
          for name, wanted in EXPECTED["files"].items():
              asset = wanted["asset"]
              if asset in assets:
                  file(download(asset), wanted)
              else:
                  target = versioned / asset
                  shutil.copyfile(pathlib.Path("out") / name, target)
                  missing.append(target)
          for path in missing:
              gh("release", "upload", "node-build", str(path))  # 无 clobber。
          if manifest_name not in assets:
              target = versioned / manifest_name
              shutil.copyfile(candidate, target)
              gh("release", "upload", "node-build", str(target))  # manifest 最后。

          # 精确版本已就绪。只有确认前进时才更新旧客户端别名；未知时保留原 pointer。
          if "build.json" in assets:
              try:
                  old = json.loads(download("build.json").read_text())["sha"]
                  if not isinstance(old, str) or not re.fullmatch(r"[0-9a-f]{40}", old):
                      raise ValueError("invalid previous SHA")
                  relation = gh("api", f"repos/{os.environ['GH_REPO']}/compare/{old}...{EXPECTED['sha']}",
                                "--jq", ".status").strip()
              except (subprocess.CalledProcessError, ValueError, KeyError, TypeError):
                  relation = "unknown"
              if relation not in ("ahead", "identical"):
                  print("保留旧兼容 pointer：" + relation)
                  raise SystemExit(0)
          gh("release", "upload", "node-build", *[str(pathlib.Path("out") / n) for n in EXPECTED["files"]], "--clobber")
          # 同 SHA 重跑保留原 manifest 的 built_at/run_url，而非改写不可变版本记录。
          pointer = versioned / "build.json"
          shutil.copyfile(candidate, pointer)
          gh("release", "upload", "node-build", str(pointer), "--clobber")
          PY
